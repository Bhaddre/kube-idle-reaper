apiVersion: v1
kind: ServiceAccount
metadata:
  name: idle-reaper
  namespace: idle-reaper
---
# Least privilege: list deployments, and patch them. No delete, no create,
# no access to pods, secrets or anything else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: idle-reaper
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: idle-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idle-reaper
subjects:
  - kind: ServiceAccount
    name: idle-reaper
    namespace: idle-reaper
