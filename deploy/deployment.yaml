apiVersion: v1
kind: Namespace
metadata:
  name: idle-reaper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idle-reaper
  namespace: idle-reaper
  labels:
    app.kubernetes.io/name: idle-reaper
spec:
  replicas: 1
  # One at a time. Two reapers wouldn't corrupt anything (every write is a
  # merge patch, scale-downs are resourceVersion-guarded) but they'd each
  # get their own max-scale-per-cycle budget, which defeats the cap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: idle-reaper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idle-reaper
    spec:
      serviceAccountName: idle-reaper
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: idle-reaper
          image: ghcr.io/bhaddre/kube-idle-reaper:v0.1.0   # build with the Dockerfile and push to your registry
          args:
            - --prometheus=http://prometheus-operated.monitoring.svc:9090
            - --interval=5m
            - --default-grace=48h
            - --max-scale-per-cycle=5
            - --dry-run=true          # flip to false once the would-scale-at annotations look right
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: idle-reaper
  namespace: idle-reaper
  labels:
    app.kubernetes.io/name: idle-reaper
spec:
  selector:
    app.kubernetes.io/name: idle-reaper
  ports:
    - name: http
      port: 8080
      targetPort: http
